<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Spotify Downloader | HamzaEditz 2.0</title>

  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-hover: rgba(255, 255, 255, 0.95);
      --fg: #0f172a;
      --muted: #64748b;
      --line: rgba(226, 232, 240, 0.85);
      --line-subtle: rgba(241, 245, 249, 0.75);
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.15);
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 16px 36px -10px rgba(15, 23, 42, 0.1);

      /* Gemini Fluid & Stroke Palette */
      --gemini-c1: #4285F4;
      --gemini-c2: #9b51e0;
      --gemini-c3: #00d2ff;
      --gemini-c4: #ff5277;
      --gemini-opacity: 0.35;
      --gemini-blur: 70px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07080d;
        --surface: rgba(17, 19, 27, 0.76);
        --surface-hover: rgba(24, 28, 40, 0.92);
        --fg: #f8fafc;
        --muted: #94a3b8;
        --line: rgba(255, 255, 255, 0.08);
        --line-subtle: rgba(255, 255, 255, 0.04);
        --accent: #22c55e;
        --accent-glow: rgba(34, 197, 94, 0.2);
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
        --shadow-md: 0 18px 40px -8px rgba(0, 0, 0, 0.7);

        --gemini-c1: #3b82f6; 
        --gemini-c2: #8b5cf6; 
        --gemini-c3: #06b6d4; 
        --gemini-c4: #ec4899; 
        --gemini-opacity: 0.45;
        --gemini-blur: 85px;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Living Fluid Background */
    .gemini-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      opacity: var(--gemini-opacity);
      filter: blur(var(--gemini-blur));
      transform: translate3d(0, 0, 0);
    }
    .gemini-mesh {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140vw;
      height: 140vh;
      transform: translate(-50%, -50%);
    }
    .fluid-blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform, border-radius;
    }
    .blob-1 {
      top: 15%; left: 15%; width: clamp(280px, 45vw, 650px); height: clamp(280px, 45vw, 650px);
      background: radial-gradient(circle, var(--gemini-c1) 0%, transparent 75%);
      animation: morphG1 18s ease-in-out infinite alternate;
    }
    .blob-2 {
      top: 10%; right: 10%; width: clamp(300px, 50vw, 700px); height: clamp(300px, 50vw, 700px);
      background: radial-gradient(circle, var(--gemini-c2) 0%, transparent 75%);
      animation: morphG2 22s ease-in-out infinite alternate;
    }
    .blob-3 {
      bottom: 10%; left: 20%; width: clamp(260px, 42vw, 600px); height: clamp(260px, 42vw, 600px);
      background: radial-gradient(circle, var(--gemini-c3) 0%, transparent 75%);
      animation: morphG3 20s ease-in-out infinite alternate;
    }
    .blob-4 {
      bottom: 20%; right: 20%; width: clamp(240px, 38vw, 550px); height: clamp(240px, 38vw, 550px);
      background: radial-gradient(circle, var(--gemini-c4) 0%, transparent 75%);
      animation: morphG4 25s ease-in-out infinite alternate;
    }

    @keyframes morphG1 {
      0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(0, 0) rotate(0deg); }
      100% { border-radius: 35% 65% 60% 40% / 55% 35% 65% 45%; transform: translate(4vw, 10vh) rotate(180deg); }
    }
    @keyframes morphG2 {
      0% { border-radius: 50% 50% 35% 65% / 60% 40% 60% 40%; transform: translate(0, 0) rotate(0deg); }
      100% { border-radius: 65% 35% 42% 58% / 38% 62% 38% 62%; transform: translate(-6vw, -6vh) rotate(-180deg); }
    }
    @keyframes morphG3 {
      0% { border-radius: 60% 40% 55% 45% / 40% 50% 50% 60%; transform: translate(0, 0); }
      100% { border-radius: 40% 60% 38% 62% / 62% 38% 62% 38%; transform: translate(6vw, -8vh); }
    }
    @keyframes morphG4 {
      0% { border-radius: 45% 55% 40% 60% / 50% 40% 60% 50%; transform: translate(0, 0); }
      100% { border-radius: 60% 40% 65% 35% / 40% 60% 40% 60%; transform: translate(-5vw, -6vh); }
    }

    .wrap {
      position: relative;
      z-index: 10;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* Header */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .hdr-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: inherit;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }

    /* Hero / Intro */
    .hero {
      text-align: center;
      padding: 40px 16px 24px;
    }
    .spotify-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .sub {
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Gemini Stroke Container */
    .gemini-stroke-card {
      position: relative;
      border-radius: 20px;
      padding: 2px;
      background: var(--line);
      overflow: hidden;
      margin-top: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .gemini-stroke-card::before {
      content: "";
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        var(--gemini-c1),
        var(--gemini-c2),
        var(--gemini-c4),
        var(--gemini-c3),
        var(--gemini-c1)
      );
      opacity: 0.6;
      animation: rotateStroke 4s linear infinite;
      z-index: 1;
      transition: opacity 0.3s ease;
    }

    .gemini-stroke-card:focus-within::before,
    .gemini-stroke-card:hover::before {
      opacity: 1;
    }

    .gemini-stroke-card:focus-within {
      box-shadow: 0 12px 32px -8px rgba(66, 133, 244, 0.3), var(--shadow-md);
    }

    @keyframes rotateStroke {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .card-body {
      position: relative;
      z-index: 2;
      background: var(--surface);
      border-radius: 18px;
      padding: 22px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Input & Search Form */
    .input-box {
      display: flex;
      gap: 10px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 6px 6px 6px 14px;
      align-items: center;
      transition: border-color 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--accent);
    }
    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.92rem;
      color: var(--fg);
      font-family: inherit;
    }
    .input-box input::placeholder {
      color: var(--muted);
    }
    .fetch-btn {
      background: var(--accent);
      color: #000;
      border: none;
      outline: none;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.2s;
    }
    .fetch-btn:hover {
      opacity: 0.9;
      transform: scale(0.98);
    }
    .fetch-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Result Card */
    .result-section {
      display: none;
      margin-top: 24px;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .track-details {
      display: flex;
      gap: 18px;
      align-items: center;
    }
    @media (max-width: 500px) {
      .track-details {
        flex-direction: column;
        text-align: center;
      }
    }

    .cover-art-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 1px solid var(--line);
    }
    .cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta-info {
      flex: 1;
      min-width: 0;
    }
    .track-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist-name {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .track-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    @media (max-width: 500px) {
      .track-pills { justify-content: center; }
    }
    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--line);
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Action Buttons */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    @media (max-width: 420px) {
      .action-grid { grid-template-columns: 1fr; }
    }

    .btn-dl {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid var(--line);
    }
    .btn-mp3 {
      background: var(--accent);
      color: #000;
      border-color: transparent;
    }
    .btn-mp3:hover {
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
      transform: translateY(-2px);
    }
    .btn-cover {
      background: var(--surface);
      color: var(--fg);
    }
    .btn-cover:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    /* Status Message */
    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .status-msg.error { color: #f43f5e; display: block; }
    .status-msg.info { color: var(--muted); display: block; }

    @media (prefers-reduced-motion: reduce) {
      .fluid-blob, .gemini-stroke-card::before { animation: none !important; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- Gemini Living Fluid Background -->
  <div class="gemini-container" aria-hidden="true">
    <div class="gemini-mesh">
      <div class="fluid-blob blob-1"></div>
      <div class="fluid-blob blob-2"></div>
      <div class="fluid-blob blob-3"></div>
      <div class="fluid-blob blob-4"></div>
    </div>
  </div>

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-wrap">
      <a href="index.html" class="brand">HamzaEditz <span class="brand-tag">2.0</span></a>
      <span style="font-size: 13px; font-weight: 600; color: var(--muted);">Utilities</span>
    </div>
  </header>

  <main class="wrap">
    <!-- Intro -->
    <div class="hero">
      <div class="spotify-badge">
        <i data-lucide="music-2" style="width: 14px; height: 14px;"></i> Spotify Media Extractor
      </div>
      <h1>Download Spotify MP3</h1>
      <p class="sub">Paste track link to download audio, cover artwork, and full metadata.</p>
    </div>

    <!-- URL Input Card with Gemini Animated Stroke -->
    <div class="gemini-stroke-card">
      <div class="card-body">
        <form id="spotify-form" onsubmit="handleFetch(event)">
          <div class="input-box">
            <i data-lucide="link" style="width: 18px; height: 18px; color: var(--muted);"></i>
            <input 
              type="url" 
              id="spotify-url" 
              placeholder="https://open.spotify.com/track/..." 
              required
              autocomplete="off"
            />
            <button type="submit" class="fetch-btn" id="submit-btn">
              <span id="btn-text">Get Track</span>
              <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </form>
        <div class="status-msg" id="status-msg"></div>
      </div>
    </div>

    <!-- Track Result Card -->
    <div class="result-section" id="result-box">
      <div class="gemini-stroke-card">
        <div class="card-body">
          <div class="track-details">
            <div class="cover-art-wrap">
              <img id="track-img" class="cover-art" src="" alt="Album Art">
            </div>
            <div class="meta-info">
              <h2 class="track-name" id="track-name">Song Name</h2>
              <div class="artist-name" id="track-artist">Artist</div>
              <div class="track-pills">
                <span class="pill">
                  <i data-lucide="clock" style="width: 13px; height: 13px;"></i>
                  <span id="track-duration">--:--</span>
                </span>
                <span class="pill">
                  <i data-lucide="disc" style="width: 13px; height: 13px;"></i>
                  <span>320 kbps MP3</span>
                </span>
                <span class="pill" id="pill-album" style="display: none;">
                  <i data-lucide="folder" style="width: 13px; height: 13px;"></i>
                  <span id="track-album">Album</span>
                </span>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="action-grid">
            <a href="#" id="dl-audio-btn" class="btn-dl btn-mp3" target="_blank" rel="noopener">
              <i data-lucide="download" style="width: 18px; height: 18px;"></i>
              Download MP3
            </a>
            <a href="#" id="dl-cover-btn" class="btn-dl btn-cover" target="_blank" rel="noopener">
              <i data-lucide="image" style="width: 18px; height: 18px;"></i>
              Save Artwork
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    async function handleFetch(e) {
      e.preventDefault();
      const input = document.getElementById('spotify-url');
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const statusMsg = document.getElementById('status-msg');
      const resultBox = document.getElementById('result-box');

      let trackUrl = input.value.trim();
      if (!trackUrl) return;

      // Extract Spotify track ID or clean URL
      const trackIdMatch = trackUrl.match(/track[\/:]([a-zA-Z0-9]+)/);
      if (trackIdMatch) {
        trackUrl = `https://open.spotify.com/track/${trackIdMatch[1]}`;
      }

      statusMsg.className = "status-msg info";
      statusMsg.textContent = "Fetching track details...";
      statusMsg.style.display = "block";
      resultBox.style.display = "none";
      btn.disabled = true;
      btnText.textContent = "Loading...";

      const targetUrl = "https://musicfab.io/api/spotify";
      const payload = JSON.stringify({ url: trackUrl });

      let meta = null;

      // Waterfall Proxy Strategy for POST Requests
      const gateways = [
        // 1. Dedicated Backend/Local endpoint (agar site kisi server/Flask par ho)
        async () => {
          const res = await fetch("/api/spotify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload
          });
          return await res.json();
        },
        // 2. Direct Target Attempt
        async () => {
          const res = await fetch(targetUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload
          });
          return await res.json();
        },
        // 3. CORS Anywhere Mirror
        async () => {
          const res = await fetch("https://corsproxy.io/?" + encodeURIComponent(targetUrl), {
            method: "POST",
            headers: { 
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: payload
          });
          return await res.json();
        },
        // 4. Codetabs POST Bridge
        async () => {
          const res = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetUrl), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload
          });
          return await res.json();
        }
      ];

      for (const gateway of gateways) {
        try {
          const raw = await gateway();
          const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;

          if (parsed?.data?.metadata) {
            meta = parsed.data.metadata;
            break;
          } else if (parsed?.metadata) {
            meta = parsed.metadata;
            break;
          }
        } catch (err) {
          // Continue to next gateway
        }
      }

      try {
        if (meta && (meta.name || meta.download)) {
          document.getElementById('track-name').textContent = meta.name || "Untitled Track";
          document.getElementById('track-artist').textContent = meta.artist || "Unknown Artist";
          document.getElementById('track-duration').textContent = meta.duration || "--:--";
          document.getElementById('track-img').src = meta.image || "";
          
          if (meta.album) {
            document.getElementById('track-album').textContent = meta.album;
            document.getElementById('pill-album').style.display = "inline-flex";
          } else {
            document.getElementById('pill-album').style.display = "none";
          }

          document.getElementById('dl-audio-btn').href = meta.download || "#";
          document.getElementById('dl-cover-btn').href = meta.image || "#";

          statusMsg.style.display = "none";
          resultBox.style.display = "block";
          lucide.createIcons();
        } else {
          throw new Error("Track details could not be retrieved. Please check the URL or try again in a few moments.");
        }
      } catch (err) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = err.message || "Request failed. Please verify the URL.";
      } finally {
        btn.disabled = false;
        btnText.textContent = "Get Track";
      }
    }
  </script>
</body>
</html>
