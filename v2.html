<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HamzaEditz 2.0 - TikTok Downloader Engine 1</title>

  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg: #090a0f;
      --surface: #11131b;
      --surface-hover: #161924;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e2230;
      --line-subtle: #141724;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 16px 36px -10px rgba(0, 0, 0, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background gradient */
    body::before {
      content: "";
      position: absolute;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 480px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating Particles & Watermark SVGs */
    .background-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .floating-item {
      position: absolute;
      bottom: -90px;
      animation: floatUp 14s linear infinite;
    }

    .bubble {
      background: radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 0.25), rgba(255, 255, 255, 0.05));
      border-radius: 50%;
      backdrop-filter: blur(2px);
    }

    .tiktok-icon-bg {
      fill: rgba(255, 255, 255, 0.08);
      width: 32px;
      height: 32px;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    a { text-decoration: none; color: inherit; }

    /* Header Bar */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .hdr-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: var(--fg);
      background: var(--surface-hover);
    }

    /* Main Container */
    .main-wrap {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-section {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Input Box */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .input-wrapper input {
      width: 100%;
      padding: 14px 10px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .input-wrapper input::placeholder {
      color: var(--muted);
    }

    .btn-primary {
      background: var(--accent);
      color: #060b08;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    /* Loader */
    .loader {
      display: none;
      text-align: center;
      margin-top: 18px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .loader-inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Result Area */
    #resultArea {
      margin-top: 20px;
      display: none;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      background: var(--surface-hover);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line-subtle);
    }
    .avatar-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      object-fit: cover;
      background: #000;
    }
    .profile-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--fg);
    }
    .unique-id {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: var(--surface-hover);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line-subtle);
    }
    .stat-box span {
      color: var(--fg);
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 2px;
    }

    .video-content {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
    }
    .video-thumb {
      width: 90px;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
      background-color: #000;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .video-desc {
      font-size: 0.84rem;
      color: var(--muted);
      flex: 1;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .download-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-download {
      background: var(--surface-hover);
      color: var(--fg);
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--line);
    }
    .btn-download:hover {
      background: var(--line);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .btn-primary-dl {
      background: var(--accent);
      color: #060b08;
      border: 1px solid var(--accent);
    }
    .btn-primary-dl:hover {
      opacity: 0.92;
      background: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Background Animations -->
  <div class="background-animation" id="bgAnimation"></div>

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-wrap">
      <a href="index.html" class="brand">HamzaEditz <span class="brand-tag">Engine 1</span></a>
      <a href="tiktokmenu.html" class="back-btn">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Menu
      </a>
    </div>
  </header>

  <main class="main-wrap">
    <div class="header-section">
      <div class="badge">
        <span class="badge-dot"></span> Fast &amp; Clean Fetch
      </div>
      <h1>TikTok Downloader</h1>
      <p class="subtitle">Download clean watermark-free video or high-quality audio.</p>
    </div>

    <div class="card">
      <div class="input-group">
        <div class="input-wrapper">
          <i data-lucide="link" style="width: 18px; height: 18px; color: var(--muted); flex-shrink: 0;"></i>
          <input type="text" id="urlInput" placeholder="Paste TikTok video link here...">
        </div>
        <button class="btn-primary" onclick="fetchVideo()">
          <i data-lucide="arrow-down" style="width: 18px; height: 18px;"></i> Get Video
        </button>
      </div>

      <div class="loader" id="loader">
        <div class="loader-inner">
          <i data-lucide="loader-2" class="spin" style="width: 18px; height: 18px;"></i>
          <span>Retrieving video details...</span>
        </div>
      </div>

      <!-- Result Card -->
      <div id="resultArea">
        <div class="profile-header">
          <img src="" alt="Avatar" id="avatar" class="avatar-img">
          <div class="profile-info">
            <h3 id="authorName">User Name</h3>
            <p class="unique-id">
              <i data-lucide="at-sign" style="width: 12px; height: 12px;"></i>
              <span id="uniqueId">username</span>
            </p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            Views
            <span id="viewCount">0</span>
          </div>
          <div class="stat-box">
            Region
            <span id="region">Global</span>
          </div>
        </div>

        <div class="video-content">
          <img src="" alt="Cover" id="thumb" class="video-thumb">
          <p id="videoDesc" class="video-desc">No description available.</p>
        </div>

        <div class="download-options">
          <a href="#" id="dlNoWm" class="btn-download btn-primary-dl" target="_blank" rel="noopener noreferrer">
            <i data-lucide="download" style="width: 16px; height: 16px;"></i> Download MP4 (No Watermark)
          </a>
          <a href="#" id="dlMusic" class="btn-download" target="_blank" rel="noopener noreferrer">
            <i data-lucide="music-2" style="width: 16px; height: 16px;"></i> Download Audio (MP3)
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Floating background generator
    const bgContainer = document.getElementById('bgAnimation');
    const tiktokSvg = `<svg class="tiktok-icon-bg" viewBox="0 0 448 512"><path d="M448,209.91a210.06,210.06,0,0,1-122.77-39.25V349.38A162.55,162.55,0,1,1,185,188.31V278.2a90.25,90.25,0,1,0,43.7,77.79V83.61h79.66L308.38,15.68h0V0H308.38A209.61,209.61,0,0,0,448,159.91Z"/></svg>`;

    for (let i = 0; i < 12; i++) {
      let bubble = document.createElement('div');
      bubble.classList.add('floating-item', 'bubble');
      let size = Math.random() * 40 + 10;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}%`;
      bubble.style.animationDuration = `${Math.random() * 10 + 10}s`;
      bubble.style.animationDelay = `${Math.random() * 5}s`;
      bgContainer.appendChild(bubble);

      let icon = document.createElement('div');
      icon.classList.add('floating-item');
      icon.innerHTML = tiktokSvg;
      icon.style.left = `${Math.random() * 100}%`;
      icon.style.animationDuration = `${Math.random() * 10 + 12}s`;
      icon.style.animationDelay = `${Math.random() * 5}s`;
      bgContainer.appendChild(icon);
    }

    function formatNumber(num) {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    async function fetchVideo() {
      const url = document.getElementById('urlInput').value.trim();
      const loader = document.getElementById('loader');
      const resultArea = document.getElementById('resultArea');

      if (!url) {
        alert("Pehle TikTok link paste karein!");
        return;
      }

      loader.style.display = 'block';
      resultArea.style.display = 'none';

      try {
        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.code === 0 && data.data) {
          const vidData = data.data;

          document.getElementById('thumb').src = vidData.cover || "";
          document.getElementById('avatar').src = vidData.author?.avatar || "";

          document.getElementById('authorName').innerText = vidData.author?.nickname || "User";
          document.getElementById('uniqueId').innerText = vidData.author?.unique_id || "username";
          document.getElementById('videoDesc').innerText = vidData.title || "No description provided.";

          document.getElementById('viewCount').innerText = formatNumber(vidData.play_count);
          document.getElementById('region').innerText = vidData.region || "Global";

          document.getElementById('dlNoWm').href = vidData.play;
          document.getElementById('dlMusic').href = vidData.music;

          loader.style.display = 'none';
          resultArea.style.display = 'block';
          lucide.createIcons();
        } else {
          alert("Video nahi mili! Link check karein ya video private ho sakti hai.");
          loader.style.display = 'none';
        }
      } catch (error) {
        console.error(error);
        alert("Server error! Connection check karein.");
        loader.style.display = 'none';
      }
    }

    // Support Enter key
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchVideo();
    });

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
