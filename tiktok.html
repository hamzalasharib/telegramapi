<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HamzaEditz 2.0 - TikTok Downloader</title>

  <!-- Video.js -->
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />

  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg: #090a0f;
      --surface: #11131b;
      --surface-hover: #161924;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e2230;
      --line-subtle: #141724;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --coral: #ff5e62;
      --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Ambient background gradient glow */
    body::before {
      content: "";
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 780px;
      height: 480px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    a { text-decoration: none; color: inherit; }

    /* Header */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .hdr-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: var(--fg);
      background: var(--surface-hover);
    }

    /* Main Container */
    .main-wrap {
      position: relative;
      z-index: 10;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-section {
      text-align: center;
      margin-bottom: 28px;
      width: 100%;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 4px 14px;
      border-radius: 100px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
    }

    /* Input Bar */
    .search-wrapper {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 6px 6px 6px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-top: 20px;
    }
    .search-wrapper:focus-within {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .search-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .search-wrapper input::placeholder {
      color: var(--muted);
    }
    .btn-fetch {
      background: var(--accent);
      color: #060b08;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.2s;
      flex-shrink: 0;
    }
    .btn-fetch:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-fetch:active { transform: translateY(0); }

    /* Loading Spinner */
    #loading {
      display: none;
      margin-top: 20px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      align-items: center;
      gap: 8px;
    }
    .spin {
      animation: spinAnim 1s linear infinite;
    }
    @keyframes spinAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Result Card */
    .main-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      display: none;
      margin-top: 24px;
      box-shadow: var(--shadow-md);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-info-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .avatar-frame {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--line);
      flex-shrink: 0;
      background: #000;
    }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    .nickname { font-size: 1rem; font-weight: 700; }
    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface-hover);
      color: var(--muted);
      font-weight: 500;
      border: 1px solid var(--line-subtle);
    }

    .video-player-box {
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
      background: #000;
      border: 1px solid var(--line);
    }
    .video-js {
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 480px;
    }

    #caption {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 18px;
      padding: 12px 14px;
      background: var(--surface-hover);
      border: 1px solid var(--line-subtle);
      border-radius: 10px;
      line-height: 1.5;
      word-break: break-word;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: var(--surface-hover);
      padding: 10px 4px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid var(--line-subtle);
    }
    .stat-item svg {
      display: block;
      margin: 0 auto 4px;
      color: var(--accent);
      width: 15px;
      height: 15px;
    }
    .stat-item b {
      font-size: 0.8rem;
      color: var(--fg);
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-vid {
      background: var(--accent);
      color: #060b08;
    }
    .btn-vid:hover { opacity: 0.92; }
    .btn-aud {
      background: var(--surface-hover);
      color: var(--fg);
      border-color: var(--line);
    }
    .btn-aud:hover {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .btn-profile {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
      font-size: 0.85rem;
      padding: 12px;
    }
    .btn-profile:hover {
      color: var(--fg);
      background: var(--surface-hover);
    }

    @media (max-width: 480px) {
      .main-wrap { padding: 24px 16px 60px; }
      .search-wrapper { flex-direction: column; padding: 12px; gap: 12px; border-radius: 16px; }
      .search-wrapper input { width: 100%; text-align: center; }
      .btn-fetch { width: 100%; justify-content: center; }
      .main-card { padding: 18px; border-radius: 16px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="hdr">
    <div class="hdr-wrap">
      <a href="index.html" class="brand">HamzaEditz <span class="brand-tag">TikTok</span></a>
      <a href="welcome.html" class="back-btn">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> All Tools
      </a>
    </div>
  </header>

  <main class="main-wrap">
    <div class="header-section">
      <div class="badge">
        <span class="badge-dot"></span> Fast &amp; No Watermark
      </div>
      <h1>TikTok Video Grabber</h1>
      <p class="subtitle">Download HD MP4 video, extract audio MP3, or save profile photos.</p>

      <div class="search-wrapper">
        <i data-lucide="link" style="width: 18px; height: 18px; color: var(--muted); flex-shrink: 0;"></i>
        <input type="text" id="urlInput" placeholder="Paste TikTok video link here...">
        <button class="btn-fetch" onclick="fetchTikTokData()">
          <i data-lucide="arrow-down" style="width: 16px; height: 16px;"></i> Fetch
        </button>
      </div>

      <div id="loading">
        <i data-lucide="loader-2" class="spin" style="width: 18px; height: 18px;"></i>
        <span>Fetching media details...</span>
      </div>
    </div>

    <!-- Result Card -->
    <div class="main-card" id="resultCard">
      <div class="user-info-bar">
        <div class="avatar-frame">
          <img id="avatar" src="" alt="Creator Avatar">
        </div>
        <div>
          <h3 id="nickname" class="nickname"></h3>
          <div class="meta-tags">
            <span class="tag" id="region"></span>
            <span class="tag" id="datetime"></span>
          </div>
        </div>
      </div>

      <div class="video-player-box">
        <video id="vjs-player" class="video-js vjs-fluid vjs-big-play-centered"></video>
      </div>

      <div id="caption"></div>

      <div class="stats-grid">
        <div class="stat-item"><i data-lucide="play"></i><b id="s-play">0</b></div>
        <div class="stat-item"><i data-lucide="heart"></i><b id="s-like">0</b></div>
        <div class="stat-item"><i data-lucide="share-2"></i><b id="s-share">0</b></div>
        <div class="stat-item"><i data-lucide="clock"></i><b id="s-dur">0s</b></div>
      </div>

      <div class="action-stack">
        <a href="#" id="dl-video" class="dl-btn btn-vid" target="_blank" rel="noopener noreferrer">
          <i data-lucide="video" style="width: 18px; height: 18px;"></i> Download MP4 (No Watermark)
        </a>
        <a href="#" id="dl-audio" class="dl-btn btn-aud" target="_blank" rel="noopener noreferrer">
          <i data-lucide="music-2" style="width: 18px; height: 18px;"></i> Download Audio (MP3)
        </a>
        <button onclick="downloadProfile()" class="dl-btn btn-profile">
          <i data-lucide="image" style="width: 16px; height: 16px;"></i> View Full Avatar
        </button>
      </div>
    </div>
  </main>

  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <script>
    let player = videojs('vjs-player');

    function formatNumber(num) {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    async function fetchTikTokData() {
      const inputUrl = document.getElementById('urlInput').value.trim();
      if (!inputUrl) {
        alert("Pehle TikTok video ka link paste karein!");
        return;
      }

      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      loading.style.display = 'inline-flex';
      resultCard.style.display = 'none';

      try {
        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(inputUrl)}`);
        const res = await response.json();

        if (res.code === 0 && res.data) {
          const data = res.data;
          document.getElementById('nickname').innerText = "@" + (data.author?.unique_id || "creator");
          document.getElementById('region').innerText = "Region: " + (data.region || "Global");
          document.getElementById('caption').innerText = data.title || "No description provided.";
          document.getElementById('avatar').src = data.author?.avatar || "";

          document.getElementById('s-play').innerText = formatNumber(data.play_count);
          document.getElementById('s-like').innerText = formatNumber(data.digg_count);
          document.getElementById('s-share').innerText = formatNumber(data.share_count);
          document.getElementById('s-dur').innerText = (data.duration || 0) + "s";

          if (data.create_time) {
            const dt = new Date(data.create_time * 1000);
            document.getElementById('datetime').innerText = dt.toLocaleDateString() + " · " + dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          }

          player.src({ type: 'video/mp4', src: data.play });

          document.getElementById('dl-video').href = data.play;
          document.getElementById('dl-audio').href = data.music;

          resultCard.style.display = 'block';
          lucide.createIcons();
        } else {
          alert("Video fetch nahi hui! Link dobara check karein.");
        }
      } catch (err) {
        alert("Network error ya API issue! Connection check karein.");
      } finally {
        loading.style.display = 'none';
      }
    }

    function downloadProfile() {
      const img = document.getElementById('avatar').src;
      if (img) window.open(img, '_blank');
    }

    // Enter key support on input
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchTikTokData();
    });

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
