<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<!-- browse-v2: full catalogue via POST /subject/filter -->
<title>Movie — API Test | HamzaEditz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050510; --card:#0b0b22; --card2:#0d0d28; --line:rgba(96,165,250,.20);
  --blue:#2c67ed; --sky:#60a5fa; --cyan:#00f0ff;
  --text:#e9edfa; --muted:#9aa7c7; --muted2:#6d7a9e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(700px 420px at 12% -6%, rgba(44,103,237,.20), transparent 60%),
   radial-gradient(620px 380px at 88% 0%, rgba(0,240,255,.10), transparent 60%);}
a{color:var(--sky);text-decoration:none}
.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.5rem;font-weight:700;letter-spacing:.2px}
.top h1 span{color:var(--cyan)}
.tag{font-size:.65rem;font-weight:700;letter-spacing:2px;color:var(--cyan);border:1px solid rgba(0,240,255,.35);padding:5px 10px;border-radius:999px}
#tokenStatus{margin-left:auto;font-size:.78rem;color:var(--muted)}
.searchbar{display:flex;gap:10px;margin:20px 0 8px}
.searchbar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);
  padding:13px 16px;font:inherit;font-size:1rem;outline:none;min-width:0}
.searchbar input:focus{border-color:var(--cyan)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#3d78f5}
.btn.ghost{background:rgba(96,165,250,.10);border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}
#status{font-size:.88rem;color:var(--muted);min-height:1.3em;margin:10px 0}
#status.err{color:#ff8f8f}
.tabs{display:flex;gap:8px;margin:16px 0 4px}
.tab{background:rgba(96,165,250,.08);border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:9px 22px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 2px}
.filters label{font-size:.72rem;font-weight:700;letter-spacing:1.5px;color:var(--muted2);display:flex;flex-direction:column;gap:5px}
.filters select{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);
  padding:9px 10px;font:inherit;font-size:.88rem;font-weight:400;letter-spacing:0;outline:none;max-width:190px}
.filters select:focus{border-color:var(--cyan)}
#countLine{font-size:.85rem;color:var(--muted);margin:16px 0 10px;min-height:1.2em}
#loadMoreBtn{width:100%;padding:14px}
#loadMoreBtn[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--cyan)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--card2)}
.card .pad{padding:10px 11px 12px}
.card .t{font-weight:600;font-size:.88rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:.75rem;color:var(--muted);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:.62rem;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:999px;border:1px solid rgba(0,240,255,.35);color:var(--cyan)}
.badge.mv{border-color:rgba(96,165,250,.45);color:var(--sky)}
.imdb{color:#ffd166;font-weight:600}
details.api{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.api summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
details.api .url{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--cyan);word-break:break-all;margin:10px 0 6px}
details.api pre{font-family:"JetBrains Mono",monospace;font-size:.7rem;line-height:1.5;color:#c4cfec;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
/* detail view */
.back{margin-bottom:16px}
.dhead{display:flex;gap:20px;flex-wrap:wrap}
.dhead img{width:190px;max-width:44vw;aspect-ratio:2/3;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--card2)}
.dinfo{flex:1;min-width:230px}
.dinfo h2{font-size:1.6rem;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem;margin:9px 0}
.desc{color:#cdd7f2;line-height:1.65;font-size:.95rem;margin-top:10px;max-width:640px}
.lbl{font-size:.7rem;font-weight:700;letter-spacing:2px;color:var(--muted2);margin:20px 0 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted)}
.chip.ep{border-radius:9px;padding:6px 0;width:46px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:.75rem}
.chip.res{color:var(--cyan);border-color:rgba(0,240,255,.35);font-family:"JetBrains Mono",monospace;font-size:.72rem}
video{width:100%;max-width:640px;border-radius:14px;border:1px solid var(--line);background:#000;display:block}
.season{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.season h3{font-size:1rem;margin-bottom:10px}
.season h3 span{color:var(--muted);font-weight:400;font-size:.85rem}
@media (max-width:560px){ .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:11px} .top h1{font-size:1.25rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- LIST VIEW -->
  <section id="listView">
    <div class="top">
      <h1>Movie <span>Test</span></h1>
      <span class="tag">API TEST</span>
      <span id="tokenStatus">Guest token: loading…</span>
    </div>
    <form class="searchbar" id="searchForm">
      <input id="q" type="search" placeholder="Search movies &amp; series…" autocomplete="off">
      <button class="btn" type="submit">Search</button>
    </form>
    <div class="tabs" id="typeTabs">
      <button class="tab active" data-ch="1" type="button">Movies</button>
      <button class="tab" data-ch="2" type="button">Series</button>
    </div>
    <div class="filters">
      <label>Sort <select id="fSort">
        <option value="Latest" selected>Latest</option>
        <option value="Hottest">Hottest</option>
        <option value="Rating">Top rated</option>
        <option value="ForYou">For you</option>
      </select></label>
      <label>Genre <select id="fGenre"><option value="All">All</option></select></label>
      <label>Year <select id="fYear"><option value="All">All</option></select></label>
      <label>Country <select id="fCountry"><option value="All">All</option></select></label>
    </div>
    <div id="status">Loading…</div>
    <div class="grid" id="grid"></div>
    <div id="countLine"></div>
    <button class="btn ghost" id="loadMoreBtn" type="button" hidden>Load more</button>
    <details class="api" id="apiList" hidden>
      <summary>API response</summary>
      <div class="url" id="apiListUrl"></div>
      <pre id="apiListJson"></pre>
    </details>
  </section>

  <!-- DETAIL VIEW -->
  <section id="detailView" hidden>
    <button class="btn ghost back" id="backBtn">← Back</button>
    <div id="detailBody"></div>
    <details class="api" id="apiDetail" hidden>
      <summary>API response</summary>
      <div class="url" id="apiDetailUrl"></div>
      <pre id="apiDetailJson"></pre>
    </details>
  </section>

</div>

<script>
const API = "https://h5-api.aoneroom.com/wefeed-h5api-bff";
let token = null;
let lastListAction = () => startBrowse(true);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const year = d => (d ? String(d).slice(0,4) : "");

function setStatus(msg, isErr){
  const el = $("status");
  el.textContent = msg || "";
  el.className = isErr ? "err" : "";
}

async function getToken(){
  $("tokenStatus").textContent = "Guest token: loading…";
  const r = await fetch(API + "/home");
  const xu = r.headers.get("x-user");
  if(!xu) throw new Error("no x-user header");
  token = JSON.parse(xu).token;
  $("tokenStatus").textContent = "Guest token: loaded";
  return token;
}

async function api(path, opts = {}, retry = true){
  if(!token) await getToken();
  const url = API + path;
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), "Authorization": "Bearer " + token } });
  let json = null;
  try { json = await r.json(); } catch(e) {}
  if(retry && json && /invalid token/i.test(json.message || "")){
    await getToken();
    return api(path, opts, false);
  }
  return { url, json };
}

function showApi(box, data){
  $(box).hidden = false;
  $(box + "Url").textContent = data.url;
  $(box + "Json").textContent = JSON.stringify(data.json, null, 2);
}

function card(it){
  const el = document.createElement("div");
  el.className = "card";
  const cover = it.cover && it.cover.url ? it.cover.url : "";
  el.innerHTML =
    (cover ? '<img loading="lazy" src="' + esc(cover) + '" alt="">' : '<img alt="">') +
    '<div class="pad"><div class="t">' + esc(it.title) + '</div>' +
    '<div class="m"><span>' + esc(year(it.releaseDate)) + '</span>' +
    '<span class="badge ' + (it.subjectType === 1 ? 'mv' : '') + '">' + (it.subjectType === 1 ? "MOVIE" : "SERIES") + '</span>' +
    (it.imdbRatingValue ? '<span class="imdb">★ ' + esc(it.imdbRatingValue) + '</span>' : '') +
    '</div></div>';
  el.addEventListener("click", () => openDetail(it.subjectId));
  return el;
}

function renderGrid(items){
  const g = $("grid");
  g.innerHTML = "";
  items.forEach(it => g.appendChild(card(it)));
}

/* ---------- Full catalogue browse: POST /subject/filter ----------
   channelId 1 = Movies, 2 = Series. perPage max 50, page max 100
   (API answers 400 LIMIT_EXCEED past page 100 — narrow with the
   Genre / Year / Country filters to reach deeper slices). */
const browse = { channelId: 1, page: 0, total: 0, shown: 0, hasMore: false, loading: false, seen: new Set() };
const PER_PAGE = 50, MAX_PAGE = 100;

function browseBody(page){
  const body = { channelId: browse.channelId, sort: $("fSort").value, page, perPage: PER_PAGE };
  const g = $("fGenre").value, y = $("fYear").value, c = $("fCountry").value;
  if(g && g !== "All") body.genre = g;
  if(y && y !== "All") body.year = y;
  if(c && c !== "All") body.country = c;
  return body;
}

function setBrowseChrome(on){
  $("loadMoreBtn").hidden = !on || !browse.hasMore || browse.loading;
  if(!on) $("countLine").textContent = "";
}

function updateCount(endNote){
  const totalTxt = browse.total && browse.total < 1000000 ? " of " + browse.total.toLocaleString("en-US") : "";
  $("countLine").textContent = "Showing " + browse.shown.toLocaleString("en-US") + totalTxt + " titles." + (endNote ? " " + endNote : "");
}

async function loadFilterOptions(){
  try {
    const { json } = await api("/filter?channelId=" + browse.channelId);
    const lists = (json && json.data && json.data.filterItemsData && json.data.filterItemsData.typeList) || [];
    const mine = lists.find(t => t.channelId === browse.channelId) || lists[0];
    if(!mine) return;
    const fill = (selId, type) => {
      const grp = (mine.items || []).find(i => i.filterType === type);
      const sel = $(selId), cur = sel.value;
      sel.innerHTML = "";
      ((grp && grp.filterVals) || [{ id: "All" }]).forEach(v => {
        const o = document.createElement("option");
        o.value = v.id; o.textContent = v.name || v.id;
        sel.appendChild(o);
      });
      if([...sel.options].some(o => o.value === cur)) sel.value = cur;
    };
    fill("fGenre", "genre"); fill("fYear", "year"); fill("fCountry", "country");
  } catch(e) { /* selects stay on All */ }
}

async function fetchBrowsePage(){
  browse.loading = true; setBrowseChrome(true);
  const page = browse.page + 1;
  try {
    const { url, json } = await api("/subject/filter", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(browseBody(page))
    });
    showApi("apiList", { url, json });
    if(!json || json.code !== 0 || !json.data){
      browse.hasMore = false;
      if(json && json.reason === "LIMIT_EXCEED"){
        updateCount("The API stops browsing at page " + MAX_PAGE + " for one filter set — pick a Genre, Year or Country above to dig deeper.");
      } else setStatus("API error — retry", true);
      return;
    }
    const items = json.data.items || [];
    const pager = json.data.pager || {};
    browse.page = page;
    if(pager.totalCount) browse.total = Number(pager.totalCount) || browse.total;
    browse.hasMore = !!pager.hasMore && page < MAX_PAGE;
    const g = $("grid");
    let added = 0;
    items.forEach(it => {
      if(!it.subjectId || browse.seen.has(it.subjectId)) return;
      browse.seen.add(it.subjectId); g.appendChild(card(it)); added++;
    });
    browse.shown += added;
    if(!browse.shown){ setStatus("No titles match these filters."); updateCount(); return; }
    setStatus(browse.channelId === 1 ? "Movies — full catalogue, newest first." : "Series — full catalogue, newest first.");
    updateCount(!browse.hasMore && pager.hasMore ? "The API stops browsing at page " + MAX_PAGE + " for one filter set — pick a Genre, Year or Country above to dig deeper." : (!browse.hasMore ? "End of the catalogue." : ""));
  } catch(e){ setStatus("API error — retry", true); }
  finally { browse.loading = false; setBrowseChrome(true); }
}

async function startBrowse(reset){
  lastListAction = () => startBrowse(true);
  if(reset){
    browse.page = 0; browse.total = 0; browse.shown = 0; browse.hasMore = true; browse.seen = new Set();
    $("grid").innerHTML = "";
  }
  setStatus("Loading catalogue…");
  await fetchBrowsePage();
}

async function doSearch(q){
  lastListAction = () => doSearch(q);
  setBrowseChrome(false);
  setStatus("Searching…");
  try {
    const { url, json } = await api("/subject/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keyword: q, page: 1, perPage: 30 })
    });
    showApi("apiList", { url, json });
    const items = (json && json.data && json.data.items) || [];
    if(!items.length){ setStatus("No results for “" + q + "”."); renderGrid([]); return; }
    renderGrid(items);
    setStatus(items.length + " result" + (items.length === 1 ? "" : "s") + " for “" + q + "”.");
  } catch(e){ setStatus("API error — retry", true); }
}

function fmtDur(sec){
  sec = Number(sec) || 0;
  if(!sec) return "";
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  return h ? (h + "h " + m + "m") : (m + "m");
}

function splitList(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.map(x => typeof x === "string" ? x : (x.name || x.language || "")).filter(Boolean);
  return String(v).split(",").map(s => s.trim()).filter(Boolean);
}

async function openDetail(id){
  $("listView").hidden = true;
  $("detailView").hidden = false;
  $("detailBody").innerHTML = '<div id="status">Loading detail…</div>';
  window.scrollTo(0,0);
  try {
    const { url, json } = await api("/detail?subjectId=" + encodeURIComponent(id));
    showApi("apiDetail", { url, json });
    const s = (json && json.data && json.data.subject) || null;
    if(!s){ $("detailBody").innerHTML = '<div id="status" class="err">API error — go back and retry.</div>'; return; }
    const res = (json.data && json.data.resource) || {};
    const seasons = res.seasons || [];
    const trailer = s.trailer && s.trailer.videoAddress && s.trailer.videoAddress.url;
    const subs = splitList(s.subtitles);
    const dubs = splitList(s.dubs);
    const meta = [ year(s.releaseDate), (s.genre || "").split(",").map(x=>x.trim()).filter(Boolean).join(" · "), fmtDur(s.duration), s.countryName || "" ].filter(Boolean).join(" • ");
    let h = '<div class="dhead">' +
      (s.cover && s.cover.url ? '<img src="' + esc(s.cover.url) + '" alt="">' : '') +
      '<div class="dinfo"><h2>' + esc(s.title) + '</h2>' +
      '<div class="meta">' + esc(meta) + '</div>' +
      (s.imdbRatingValue ? '<div class="meta">IMDb <span class="imdb">★ ' + esc(s.imdbRatingValue) + '</span></div>' : '') +
      (s.description ? '<p class="desc">' + esc(s.description) + '</p>' : '') +
      '</div></div>';
    if(trailer){
      h += '<div class="lbl">TRAILER</div><video controls preload="none" src="' + esc(trailer) + '"></video>';
    }
    if(subs.length) h += '<div class="lbl">SUBTITLES</div><div class="chips">' + subs.map(x => '<span class="chip">' + esc(x) + '</span>').join("") + '</div>';
    if(dubs.length) h += '<div class="lbl">DUBS</div><div class="chips">' + dubs.map(x => '<span class="chip">' + esc(x) + '</span>').join("") + '</div>';
    seasons.forEach(sn => {
      const maxEp = Number(sn.maxEp) || 0;
      h += '<div class="season"><h3>Season ' + esc(sn.se) + ' <span>— ' + maxEp + ' episode' + (maxEp === 1 ? "" : "s") + '</span></h3>';
      const resChips = (sn.resolutions || []).map(r => '<span class="chip res">' + esc(r.resolution) + 'p · ' + esc(r.epNum) + ' ep</span>').join("");
      if(resChips) h += '<div class="chips" style="margin-bottom:10px">' + resChips + '</div>';
      if(maxEp){
        const cap = Math.min(maxEp, 100);
        let eps = "";
        for(let i = 1; i <= cap; i++) eps += '<span class="chip ep">E' + i + '</span>';
        if(maxEp > cap) eps += '<span class="chip">+' + (maxEp - cap) + ' more</span>';
        h += '<div class="chips">' + eps + '</div>';
      }
      h += '</div>';
    });
    $("detailBody").innerHTML = h;
  } catch(e){
    $("detailBody").innerHTML = '<div id="status" class="err">API error — go back and retry.</div>';
  }
}

$("backBtn").addEventListener("click", () => {
  $("detailView").hidden = true;
  $("listView").hidden = false;
  window.scrollTo(0,0);
});

$("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if(q) doSearch(q); else startBrowse(true);
});

$("status").addEventListener("click", () => {
  if($("status").classList.contains("err")) lastListAction();
});

$("typeTabs").addEventListener("click", async e => {
  const btn = e.target.closest(".tab");
  if(!btn || Number(btn.dataset.ch) === browse.channelId) return;
  document.querySelectorAll("#typeTabs .tab").forEach(t => t.classList.toggle("active", t === btn));
  browse.channelId = Number(btn.dataset.ch);
  await loadFilterOptions();
  startBrowse(true);
});

["fSort", "fGenre", "fYear", "fCountry"].forEach(id => $(id).addEventListener("change", () => startBrowse(true)));
$("loadMoreBtn").addEventListener("click", () => { if(!browse.loading && browse.hasMore) fetchBrowsePage(); });

(async () => {
  try { await getToken(); }
  catch(e){ $("tokenStatus").textContent = "Guest token: failed"; }
  await loadFilterOptions();
  startBrowse(true);
})();
</script>
</body>
</html>
