<style>
.sp{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 22px 26px;position:relative;overflow:hidden}
.sp-logo{position:relative;width:128px;height:128px;display:grid;place-items:center;animation:hzFadeUp .7s cubic-bezier(.16,1,.3,1) both}
.sp-logo::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px dashed rgba(34,211,238,.45);animation:hzSpin 16s linear infinite}
.sp-logo::after{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%)}
.sp-logo svg{width:112px;height:112px;filter:drop-shadow(0 22px 44px rgba(34,211,238,.4));animation:hzFloat 5.5s ease-in-out infinite}
.sp-wel{margin-top:38px;font-size:.78rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--hz-accent);animation:hzFadeUp .7s .08s cubic-bezier(.16,1,.3,1) both}
.sp h1{font-size:clamp(2.5rem,9vw,4.2rem);font-weight:800;margin:10px 0 0;line-height:1.05;animation:hzFadeUp .7s .16s cubic-bezier(.16,1,.3,1) both}
.sp h1 .grad{background:var(--hz-grad);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hzGradPan 6s ease infinite}
.sp p{color:var(--hz-muted);max-width:460px;line-height:1.65;font-size:1rem;margin:16px 0 0;animation:hzFadeUp .7s .24s cubic-bezier(.16,1,.3,1) both}
.sp-enter{margin-top:32px;display:inline-flex;align-items:center;gap:11px;padding:16px 34px;border-radius:999px;background:var(--hz-grad);background-size:180% 180%;animation:hzGradPan 6s ease infinite,hzFadeUp .7s .32s cubic-bezier(.16,1,.3,1) both;color:#fff!important;text-decoration:none!important;font-weight:800;font-size:1.02rem;box-shadow:0 20px 42px -12px rgba(34,211,238,.55);transition:transform .25s}
.sp-enter:hover{transform:translateY(-3px) scale(1.02)}
.sp-enter svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sp-chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:26px;animation:hzFadeUp .7s .4s cubic-bezier(.16,1,.3,1) both}
.sp-chips span{font-size:.78rem;font-weight:700;color:var(--hz-fg2);border:1px solid var(--hz-line);background:var(--hz-card);padding:7px 13px;border-radius:99px}
.sp-social{display:flex;gap:12px;margin-top:30px;animation:hzFadeUp .7s .48s cubic-bezier(.16,1,.3,1) both}
.sp-social a{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--hz-line);background:var(--hz-card);transition:.25s}
.sp-social a:hover{transform:translateY(-3px);border-color:var(--hz-line2)}
.sp-social svg{width:21px;height:21px;fill:var(--hz-fg2)}
.sp-foot{margin-top:34px;font-size:.78rem;color:var(--hz-muted2);animation:hzFadeUp .7s .56s cubic-bezier(.16,1,.3,1) both}
</style>
