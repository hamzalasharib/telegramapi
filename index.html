<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--green:#2c67ed;--green-d:#1f55c9;--ink:#f8fafc;--mut:#94a3b8;--line:#2c2c3d}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#050510;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.sp{max-width:560px;margin:0 auto;padding:64px 24px 40px;text-align:center}
.sp-logo svg{width:84px;height:84px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.sp-wel{color:var(--mut);font-size:.9rem;margin-top:22px}
.sp h1{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:2.1rem;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.sp p{color:var(--mut);font-size:.95rem;max-width:430px;margin:10px auto 0}
.sp-enter{display:block;max-width:430px;margin:26px auto 0;background:var(--green);color:#fff;text-align:center;font-weight:600;font-size:1rem;padding:13px 20px;border-radius:10px;text-decoration:none}
.sp-enter:hover{background:var(--green-d)}
.sp-tags{color:var(--mut);font-size:.82rem;margin-top:16px}
.sp-social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.sp-social a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:600}
.sp-social a svg{width:17px;height:17px;fill:var(--green)}
.sp-foot{margin-top:34px;color:var(--mut);font-size:.78rem}
</style>

<canvas id="sp-stars" style="position:fixed;inset:0;z-index:0;pointer-events:none"></canvas>
<div style="position:fixed;width:460px;height:460px;border-radius:50%;filter:blur(120px);background:#123a8f;top:-160px;left:-120px;z-index:0;pointer-events:none;opacity:.45"></div>
<div style="position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(120px);background:#0b3b4d;bottom:-140px;right:-120px;z-index:0;pointer-events:none;opacity:.45"></div>
<script>
(function(){var cv=document.getElementById('sp-stars'),cx=cv.getContext('2d'),W,H,st=[];
function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight;st=[];var n=Math.min(140,Math.floor(W*H/10000));for(var i=0;i<n;i++)st.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:.4+Math.random()*1.2});}
sz();addEventListener('resize',sz);
(function tick(t){cx.clearRect(0,0,W,H);for(var i=0;i<st.length;i++){var s=st[i];cx.globalAlpha=.3+.65*Math.abs(Math.sin(t*.0004*s.s+s.p));cx.fillStyle='#dbeafe';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.29);cx.fill();}requestAnimationFrame(tick);})(0);
var m=document.querySelector('.sp');if(m){m.style.position='relative';m.style.zIndex='1';}
})();
</script>
