<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HamzaEditz 2.0 - Free GitHub RDP Setup</title>

  <!-- Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- External Script -->
  <script>(function(s){s.dataset.zone='11619858',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <style>
    :root {
      --bg: #090a0f;
      --surface: #11131b;
      --surface-hover: #161924;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e2230;
      --line-subtle: #141724;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.15);
      --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 16px 36px -10px rgba(0, 0, 0, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background gradient glow */
    body::before {
      content: "";
      position: absolute;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    a { text-decoration: none; color: inherit; }

    /* Sticky Header */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .hdr-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: var(--fg);
      background: var(--surface-hover);
    }

    /* Main Container */
    .main-wrap {
      position: relative;
      z-index: 10;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .header-section {
      text-align: center;
      width: 100%;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto;
    }

    /* Video Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Code Block Box */
    .code-wrapper {
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: #06070a;
      box-shadow: var(--shadow-md);
    }
    .code-header {
      background: var(--surface);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .code-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--fg);
      font-family: var(--font-mono);
    }
    .code-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .copy-btn {
      background: var(--surface-hover);
      color: var(--fg);
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .copy-btn:hover {
      background: var(--accent);
      color: #060b08;
      border-color: var(--accent);
    }

    pre {
      background: #050608;
      padding: 20px;
      overflow-x: auto;
      white-space: pre;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #e2e8f0;
      max-height: 540px;
      line-height: 1.55;
    }
    pre::-webkit-scrollbar {
      height: 8px;
    }
    pre::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }

    /* Code Syntax Highlighting */
    .yaml-key { color: #38bdf8; font-weight: 600; }
    .yaml-string { color: #a7f3d0; }
    .yaml-comment { color: #64748b; font-style: italic; }

    @media (max-width: 600px) {
      .main-wrap { padding: 30px 16px 60px; }
      .card { padding: 18px; border-radius: 16px; }
      .code-wrapper { border-radius: 16px; }
      .code-header { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-wrap">
      <a href="index.html" class="brand">HamzaEditz <span class="brand-tag">RDP</span></a>
      <a href="RdpMethod.html" class="back-btn">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> All Methods
      </a>
    </div>
  </header>

  <main class="main-wrap">
    <div class="header-section">
      <div class="badge">
        <span class="badge-dot"></span> GitHub Actions &amp; Tailscale
      </div>
      <h1>Free GitHub RDP Guide</h1>
      <p class="subtitle">Deploy a dedicated high-performance Windows remote desktop workflow in minutes.</p>
    </div>

    <!-- Video Demonstration -->
    <section class="card">
      <h2 class="card-title">
        <i data-lucide="play-circle" style="width: 18px; height: 18px; color: var(--accent);"></i> Video Demonstration
      </h2>
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/WlzROnuv3JU?si=364WfPe9kOx4qTrR&amp;controls=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </section>

    <!-- Code Block -->
    <section class="code-wrapper">
      <div class="code-header">
        <div class="code-title">
          <span class="code-dot"></span>
          <span>.github/workflows/RDP.yml</span>
        </div>
        <button id="copyButton" class="copy-btn">
          <i data-lucide="copy" style="width: 14px; height: 14px;"></i>
          <span id="copyText">Copy YAML</span>
        </button>
      </div>
      <pre><code id="codeBlock">Loading workflow script...</code></pre>
    </section>
  </main>

  <script>
    const rawCode = `name: RDP
on:
  workflow_dispatch:
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server' \`
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' \`
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' \`
            -Name "SecurityLayer" -Value 0 -Force
          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" \`
            dir=in action=allow protocol=TCP localport=3389
          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) +
                       [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "User creation failed"
            exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "\`"$installerPath\`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\\Tailscale\\tailscale.exe" up --authkey=\${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\\Tailscale\\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "\`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo$env:RDP_CREDS)"
          Write-Host "==================\`n"
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }`;

    function highlightYAML(code) {
      let escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      escaped = escaped.replace(/^(\s*)(\w+):/gm, '$1<span class="yaml-key">$2</span>:');
      escaped = escaped.replace(/: (\|)?\s*([^\n]+)/g, (match, p1, p2) => {
        if (p2.startsWith('#')) return match;
        return `: ${p1 || ''} <span class="yaml-string">${p2}</span>`;
      });
      escaped = escaped.replace(/(\n\s*)(#.*)/g, '$1<span class="yaml-comment">$2</span>');
      return escaped;
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const codeBlock = document.getElementById('codeBlock');
      codeBlock.innerHTML = highlightYAML(rawCode.trim());

      const copyButton = document.getElementById('copyButton');
      const copyText = document.getElementById('copyText');

      copyButton.addEventListener('click', () => {
        navigator.clipboard.writeText(rawCode.trim())
          .then(() => {
            copyText.textContent = "Copied!";
            copyButton.style.background = "var(--accent)";
            copyButton.style.color = "#060b08";
            setTimeout(() => {
              copyText.textContent = "Copy YAML";
              copyButton.style.background = "";
              copyButton.style.color = "";
            }, 2000);
          })
          .catch(err => {
            console.error('Failed to copy code: ', err);
            copyText.textContent = "Error";
            setTimeout(() => { copyText.textContent = "Copy YAML"; }, 2000);
          });
      });
    });
  </script>
</body>
</html>
