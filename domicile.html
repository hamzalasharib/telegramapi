<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domicile Verify — Punjab Record | HamzaEditz 2.0</title>
<meta name="description" content="Verify a Punjab domicile record by CNIC — name, district, tehsil and application status.">
<meta name="theme-color" content="#070a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334d399'/%3E%3Cstop offset='.5' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Crect x='27' y='25' width='11' height='50' rx='4' fill='white'/%3E%3Crect x='62' y='25' width='11' height='50' rx='4' fill='white'/%3E%3Crect x='38' y='44' width='24' height='11' rx='4' fill='white'/%3E%3Cpath d='M46 38.5v23l20-11.5z' fill='%230b101d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="hamza-ui.css"><script src="hamza-ui.js" defer></script><script src="hamza-ads.js" defer></script>
<style>
.hz-wrap{max-width:880px;margin:0 auto;padding:10px 22px 20px}
.hz-sec{background:var(--hz-card);border:1px solid var(--hz-line);border-radius:20px;padding:24px;margin-top:26px;box-shadow:var(--hz-shadow)}
.hz-sec h2{margin:0 0 8px;font-size:1.22rem}
.hz-sec p{color:var(--hz-muted);line-height:1.65;margin:0 0 6px}
.hz-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hz-row input{flex:1;min-width:200px;padding:14px 16px;font-size:1rem}
.hz-go{padding:14px 26px;font-size:.95rem;white-space:nowrap}
.hz-msg{margin-top:14px;font-size:.9rem;font-weight:600;display:none}
.hz-msg.err{color:#f87171}.hz-msg.ok{color:var(--hz-accent)}
.hz-out{margin-top:18px;display:none}
.hz-rcard{border:1px solid var(--hz-line);border-radius:18px;overflow:hidden;background:var(--hz-card)}
.hz-rhead{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px dashed var(--hz-line);flex-wrap:wrap}
.hz-ava{width:54px;height:54px;flex:none;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:1.05rem;color:#fff;background:linear-gradient(135deg,var(--a1,#22c55e),var(--a2,#16a34a))}
.hz-rhead h3{margin:0;font-size:1.12rem}
.hz-rhead .sub{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--hz-muted);margin-top:3px}
.hz-badge{margin-left:auto;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:99px;border:1px solid}
.hz-badge.g{color:#22c55e;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.12)}
.hz-badge.y{color:#eab308;border-color:rgba(234,179,8,.4);background:rgba(234,179,8,.12)}
.hz-drow{display:flex;gap:13px;padding:13px 20px;border-bottom:1px solid var(--hz-line);align-items:baseline}
.hz-drow:last-child{border-bottom:0}
.hz-drow .k{flex:none;width:130px;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hz-muted)}
.hz-drow .v{font-weight:600;font-size:.95rem;word-break:break-word}
.hz-acts{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--hz-line);flex-wrap:wrap}
.hz-acts button{padding:11px 18px;font-size:.86rem}
.hz-grid-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:16px}
@media(max-width:520px){.hz-grid-btns{grid-template-columns:1fr}}
.hz-grid-btns button{padding:15px;font-size:.92rem}
.hz-json{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--hz-fg2);background:rgba(0,0,0,.25);border:1px solid var(--hz-line);border-radius:12px;padding:14px;margin-top:12px;max-height:300px;overflow:auto}
.hz-legal{text-align:center;margin-top:30px;color:var(--hz-muted);font-size:.86rem}
.hz-legal b{display:block;font-family:Sora,sans-serif;color:var(--hz-fg2);font-size:.95rem;margin-bottom:4px}
.hz-pillstat{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--hz-line);background:var(--hz-card);color:var(--hz-muted)}
.hz-dot{width:8px;height:8px;border-radius:50%;background:#eab308}
.hz-dot.on{background:#22c55e;box-shadow:0 0 10px #22c55e}
</style>
</head>
<body>
<div class="hz-wrap">

<section class="hz-sec">
<h2>Check a domicile record by CNIC</h2>
<p>Enter a 13-digit CNIC to see the Punjab domicile record — name, father name, district, tehsil and status.</p>
<div class="hz-row">
<input id="cnic" type="text" inputmode="numeric" autocomplete="off" maxlength="15" placeholder="32304-XXXXXXX-X" aria-label="CNIC number">
<button type="button" class="hz-go" id="domBtn" onclick="domVerify()">Verify Domicile</button>
</div>
<div class="hz-msg" id="domMsg"></div>
<div class="hz-out" id="domOut"></div>
</section>
<div class="hz-legal"><b>Domicile Punjab Record Legal Advice</b> Records are verified from the official Punjab domicile portal. Misuse is the responsibility of the user.</div>
</div>
<script>
var cnicEl = document.getElementById('cnic');
cnicEl.addEventListener('input', function(){
  var v = cnicEl.value.replace(/\D/g,'').slice(0,13), f = v;
  if (v.length > 5 && v.length <= 12) f = v.slice(0,5) + '-' + v.slice(5);
  else if (v.length > 12) f = v.slice(0,5) + '-' + v.slice(5,12) + '-' + v.slice(12);
  cnicEl.value = f;
});
cnicEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') domVerify(); });
function domMsg(txt, ok){
  var m = document.getElementById('domMsg');
  m.textContent = txt; m.className = 'hz-msg ' + (ok ? 'ok' : 'err');
  m.style.display = txt ? 'block' : 'none';
}
function esc(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
function renderDom(d){
  var i = d.data, init = (i.name || '?').split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();
  var iss = (i.status || '').toLowerCase().indexOf('issued') > -1;
  document.getElementById('domOut').innerHTML =
   '<div class="hz-rcard"><div class="hz-rhead"><div class="hz-ava" style="--a1:#22c55e;--a2:#16a34a">' + esc(init) + '</div>' +
   '<div><h3>' + esc(i.name) + '</h3><div class="sub">' + esc(d.cnic) + '</div></div>' +
   '<span class="hz-badge ' + (iss ? 'g' : 'y') + '">' + esc(i.status || 'Record') + '</span></div>' +
   '<div class="hz-drow"><span class="k">Father Name</span><span class="v">' + (esc(i.father) || '—') + '</span></div>' +
   '<div class="hz-drow"><span class="k">District</span><span class="v">' + esc(i.district) + '</span></div>' +
   '<div class="hz-drow"><span class="k">Tehsil</span><span class="v">' + esc(i.tehsil) + '</span></div>' +
   '<div class="hz-drow"><span class="k">Submission Date</span><span class="v">' + esc(i.submission_date) + '</span></div>' +
   '<div class="hz-acts"><button type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector(\'.hz-rcard\').innerText)">Copy Record</button>' +
   '<button type="button" onclick="window.print()">Print</button></div></div>';
  document.getElementById('domOut').style.display = 'block';
}
async function domVerify(){
  var raw = cnicEl.value.replace(/\D/g,'');
  if (raw.length !== 13){ domMsg('CNIC must be 13 digits'); return; }
  var btn = document.getElementById('domBtn');
  btn.disabled = true; btn.textContent = 'Checking...'; domMsg('');
  document.getElementById('domOut').style.display = 'none';
  try {
    var r = await fetch('/api/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cnic: raw})});
    var d = await r.json();
    if (d.success){ renderDom(d); domMsg('Record mil gaya', true); }
    else domMsg(d.error || 'Record not found');
  } catch(e) {
    try {
      var u = 'https://domicile.punjab.gov.pk/AjaxCall.aspx?ID=' + raw;
      var html = '';
      try {
        var rr = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u));
        html = await rr.text();
      } catch(e3) { html = ''; }
      if (!html || html.indexOf('lblName') === -1) {
        var rt = await fetch('https://domicile-punjab-gov-pk.translate.goog/AjaxCall.aspx?ID=' + raw + '&_x_tr_sl=ur&_x_tr_tl=en&_x_tr_hl=en');
        html = await rt.text();
      }
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var g = function(id){ var el = doc.getElementById(id); return el ? el.textContent.trim() : ''; };
      if (g('lblName')) renderDom({cnic: raw.slice(0,5)+'-'+raw.slice(5,12)+'-'+raw.slice(12), data:{name:g('lblName'), father:g('lblGaudain2'), district:g('lblDistrict'), tehsil:g('lblTehsil'), status:g('lblStatus'), submission_date:g('lblSubmissionDate')}});
      else domMsg('No record found for this CNIC');
    } catch(e2){ domMsg('Portal is slow — try again, it often works on the second try'); }
  } finally { btn.disabled = false; btn.textContent = 'Verify Domicile'; }
}
</script>
</body>
</html>
